<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Steadfast Ops Login</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: #090d16;
      font-family: system-ui, -apple-system, sans-serif;
      color: #f8fafc;
    }
    .login-card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 36px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    .login-card h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 20px;
      font-weight: 700;
      color: #38bdf8;
      letter-spacing: -0.5px;
    }
    .login-card p {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 14px;
      background: #020617;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      font-family: monospace;
      font-size: 14px;
    }
    .form-group input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: #0284c7;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .login-btn:hover {
      background: #0369a1;
    }
    .error-msg {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>STEADFAST OPERATIONS</h2>
    <p>Enter your operator token to access the operations console.</p>
    <div id="error-box" class="error-msg"></div>
    <form id="login-form" method="POST" action="/ops/login">
      <div class="form-group">
        <label for="ops_token">Operator Token (OPS_TOKEN)</label>
        <input type="password" id="ops_token" name="ops_token" required placeholder="Paste token from .env">
      </div>
      <button type="submit" class="login-btn">Authenticate & Access Console</button>
    </form>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const err = params.get('error');
    if (err) {
      const box = document.getElementById('error-box');
      box.style.display = 'block';
      if (err === 'rate_limit') {
        box.textContent = 'Too many failed login attempts. Please wait 1 minute before retrying.';
      } else {
        box.textContent = 'Invalid operator token. Please check .env and try again.';
      }
    }
  </script>
</body>
</html>
